[project]
name = "responsible-ai-lab"
version = "0.1.0"
description = "Synthetic ML fairness and governed RAG teaching projects"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2.4", "numba>=0.61,<0.65", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "shap>=0.46,<1", "lime>=0.2.0.1", "fairlearn>=0.12,<1", "aif360>=0.6,<1", "langchain-core>=0.3.78,<0.4", "semantic-kernel>=1.39,<2"]

[project.optional-dependencies]
eval = ["deepeval>=3,<4", "ragas>=0.3,<0.4", "langchain>=0.3.27,<0.4", "langchain-community>=0.3.27,<0.4", "trulens>=2,<3", "trulens-providers-openai>=2,<3", "langchain-openai>=0.3.35,<0.4"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-p no:deepeval"
pythonpath = ["."]
testpaths = ["tests"]
